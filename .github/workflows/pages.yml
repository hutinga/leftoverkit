name: Demo site

on:
  push:
    branches: [main]
    paths:
      - docs/first-scan.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the standalone replay
        run: install -D docs/first-scan.html "$RUNNER_TEMP/site/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@v4
        id: publish

name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest pytest-cov ruff
      - run: ruff check src tests scripts
      - run: pytest -q --cov=leftoverkit --cov-report=term-missing --cov-fail-under=80
      - name: Verify recorded first scan
        run: |
          cp docs/first-scan.html "$RUNNER_TEMP/first-scan.html"
          python scripts/discovery_fixture.py --replay "$RUNNER_TEMP/first-scan.html"
          cmp docs/first-scan.html "$RUNNER_TEMP/first-scan.html"
      - run: python scripts/demo.py
      - run: python scripts/showcase_fixture.py

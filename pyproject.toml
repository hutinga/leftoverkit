[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leftoverkit"
version = "0.3.0"
description = "Inspect development leftovers and quarantine artifacts with explicit task scope."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
leftoverkit = "leftoverkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leftoverkit"]

[tool.ruff]
line-length = 105

[tool.pytest.ini_options]
testpaths = ["tests"]
